spring.application.name=uberApp

# DB configuration - credentials are provided via environment variables (see .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boilerplate?useSSL=false}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Security - JWT signing key is provided via environment variable.
# HS256 requires at least 32 bytes (256 bits); use a long random value.
jwt.secretKey=${JWT_SECRET_KEY}

# SMTP config - credentials are provided via environment variables.
# 587 is the authenticated port, 25 is the unauthenticated port.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
